name: Index Docs to Docs MCP Server
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**/README.md"

jobs:
  index:
    name: Index Docs to Docs MCP Server
    runs-on: [arc-arm]
    steps:
      - uses: voxmedia/docs-mcp-server/.github/actions/index-docs@main
        with:
          server-url: https://docs-mcp.voxops.net
          auth-user: ${{ secrets.DOCS_MCP_AUTH_USER }}
          auth-pass: ${{ secrets.DOCS_MCP_AUTH_PASS }}
